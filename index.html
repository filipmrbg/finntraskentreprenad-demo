<!doctype html>
<html lang="sv">

<head>
  <meta charset="UTF-8" />
  <!-- Preconnect & Preload for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://d8j0ntlcm91z4.cloudfront.net" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="preload" as="image" href="/logo.png" fetchpriority="high" type="image/png" />
  <link rel="preload" as="image" href="/logo-white.png" fetchpriority="high" type="image/png" />

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff7900" />

  <!--
    Per-route SEO (title, description, canonical, Open Graph, Twitter, JSON-LD) is
    generated at build time by scripts/prerender.mjs from src/data/seo.ts and
    src/seo/head.ts. Everything between the markers below is replaced for each page.
    The domain is configured in src/config/site.ts.
  -->
  <!--app-head-start-->
  <title>Mark- och schaktarbeten i Skellefteå | Finnträsk Entreprenad</title>
  <meta name="description" content="Finnträsk Entreprenad utför markarbeten, grundläggning, skogsvägar och trädfällning i Skellefteå, Byske och Västerbotten. Begär kostnadsfri offert!" />
  <!--app-head-end-->
</head>

<body>
  <div id="root"><!--app-html--></div>
  <script async src="//www.instagram.com/embed.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
